name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: 🔎 Locate Flutter Project Directory
        id: locate-project
        run: |
          PROJECT_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then PROJECT_PATH="."; fi
          echo "project_path=$PROJECT_PATH" >> $GITHUB_OUTPUT

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Configure Android Dependencies & Jitsi Repositories
        run: |
          cd "${{ steps.locate-project.outputs.project_path }}"
          if [ -f "android/build.gradle" ] && ! grep -q "jitsi-maven-repository" android/build.gradle; then
            sed -i '/repositories {/a \        maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }' android/build.gradle
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ] && ! grep -q 'tools:replace' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' android/app/src/main/AndroidManifest.xml
            sed -i 's/<application /<application tools:replace="android:label" /' android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdk/minSdk = 24/g' android/app/build.gradle 2>/dev/null || true

      - name: 📦 Install Flutter Dependencies
        run: |
          cd "${{ steps.locate-project.outputs.project_path }}"
          flutter pub get

      - name: 🔨 Build Universal Release APK
        run: |
          cd "${{ steps.locate-project.outputs.project_path }}"
          flutter build apk --release

      - name: 📤 Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TogetherForTwo-Universal-APK
          path: ${{ steps.locate-project.outputs.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14