name: together_for_two
description: "A synchronized cross-platform Flutter app for distant couples and pairs to read, watch, call, chat, and take notes together."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Calls & Meetings
  jitsi_meet_flutter_sdk: ^11.0.0

  # PDF & Document Viewing
  pdfx: ^2.6.0

  # Video & YouTube Playback
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1

  # File Picker & Document Generation
  file_picker: ^8.1.4
  pdf: ^3.11.1
  printing: ^5.13.2

  # Platform & Utilities
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true